<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOC Analysis Hub — Analyst Triage</title>
  <link rel="stylesheet" href="/ui-assets/styles.css" />
  <style>
    .triage-table { width: 100%; border-collapse: collapse; text-align: left; }
    .triage-table th { background: rgba(0,0,0,0.2); padding: 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
    .triage-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
    .triage-table tr:hover { background: rgba(255,255,255,0.02); cursor: pointer; }
    .action-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
    .action-btn:hover { background: rgba(255,255,255,0.2); }
    .action-btn.approve { background: rgba(16, 185, 129, 0.2); color: #10B981; }
    .action-btn.reject { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>

  <script src="/ui-assets/app.js"></script>
  <script>
    AgentUI.onReady(() => {
      const app = document.getElementById("app");
      app.innerHTML = `
        ${AgentUI.topbarHTML()}
        
        <section class="hero animate-in mb-md">
          <div class="panel">
            <h1 class="hero-title">Analyst Triage Workbench</h1>
            <p class="hero-subtitle">Review pending suspicious emails, provide feedback to tune agent weights via Active Learning, and trigger automated playbooks.</p>
          </div>
        </section>

        <section class="panel animate-in-d1 mb-md">
            <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:1rem">
                <h2 class="section-title" style="margin:0"><span class="icon">🔍</span> Triage Queue</h2>
                <div class="row" style="gap:10px">
                    <button class="btn-outline btn-sm" onclick="loadQueue()">🔄 Refresh</button>
                </div>
            </div>

            <div style="overflow-x:auto">
                <table class="triage-table" id="triageTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Analysis ID</th>
                            <th>Sender</th>
                            <th>Risk</th>
                            <th>Verdict</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="triageBody">
                        <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--ink-muted)">Loading queue...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
      `;
      AgentUI.initSettingsDropdown();
      loadQueue();
    });

    async function loadQueue() {
        const tbody = document.getElementById("triageBody");
        try {
            const res = await AgentUI.apiFetch("/soc/overview");
            const data = await res.json();

            const reports = (data.reports && data.reports.recent) || [];

            if (reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--ink-muted)">Queue is empty.</td></tr>';
                return;
            }

            let html = '';
            reports.forEach(r => {
                const date = new Date(r.created_at).toLocaleString();
                html += `
                    <tr onclick="window.location.href='/ui/report/${r.analysis_id}'">
                        <td style="color:var(--ink-soft)">${date}</td>
                        <td style="font-family:monospace; color:var(--accent-blue)">${r.analysis_id.substring(0,8)}...</td>
                        <td>${r.sender || 'Unknown'}</td>
                        <td><strong>${r.overall_risk_score.toFixed(3)}</strong></td>
                        <td><span class="verdict-badge ${AgentUI.verdictClass(r.verdict)}">${r.verdict}</span></td>
                        <td onclick="event.stopPropagation()">
                            <div class="row" style="gap:4px">
                                <button class="action-btn approve" onclick="submitFeedback('${r.analysis_id}', 'true_positive')" title="Confirm as Malicious">TP</button>
                                <button class="action-btn reject" onclick="submitFeedback('${r.analysis_id}', 'false_positive')" title="Mark as False Positive">FP</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:#EF4444">Error loading queue: ${e.message}</td></tr>`;
        }
    }

    async function submitFeedback(analysisId, verdict) {
        try {
            await AgentUI.apiFetch(`/reports/${analysisId}/feedback`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    analyst_verdict: verdict,
                    notes: "Submitted via Triage UI"
                })
            });
            alert(`Feedback recorded: ${verdict}. Active learning weights will adjust accordingly.`);
        } catch (e) {
            alert(`Failed to submit feedback: ${e.message}`);
        }
    }
  </script>
</body>
</html>
