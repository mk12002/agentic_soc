<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOC Analysis Hub — Campaign Correlation</title>
  <link rel="stylesheet" href="/ui-assets/styles.css" />
</head>
<body>
  <main class="shell" id="app"></main>

  <script src="/ui-assets/app.js"></script>
  <script>
    AgentUI.onReady(() => {
      const app = document.getElementById("app");
      app.innerHTML = `
        ${AgentUI.topbarHTML()}
        
        <section class="hero animate-in mb-md">
          <div class="panel">
            <h1 class="hero-title">Campaign Correlation</h1>
            <p class="hero-subtitle">Detect coordinated attacks targeting multiple users based on sender domain and subject similarity fingerprinting.</p>
          </div>
        </section>

        <section class="panel animate-in-d1 mb-md">
            <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:1rem">
                <h2 class="section-title" style="margin:0"><span class="icon">🕸️</span> Active Campaigns</h2>
                <button class="btn-outline btn-sm" onclick="loadCampaigns()">🔄 Refresh</button>
            </div>

            <div id="campaignList" style="display:flex; flex-direction:column; gap:1rem">
                <div style="text-align:center; padding:2rem; color:var(--ink-muted)">Loading campaigns...</div>
            </div>
        </section>
      `;
      AgentUI.initSettingsDropdown();
      loadCampaigns();
    });

    async function loadCampaigns() {
        const container = document.getElementById("campaignList");
        try {
            const res = await AgentUI.apiFetch("/ops/campaigns");
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "HTTP " + res.status);

            const campaigns = data.campaigns || [];

            if (campaigns.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--ink-muted)">No active campaigns detected.</div>';
                return;
            }

            container.innerHTML = campaigns.map(c => `
                <div style="background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:1.5rem">
                    <div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:1rem">
                        <div>
                            <h3 style="margin:0 0 4px 0; color:var(--accent-blue)">${c.sender_domain || 'Unknown sender domain'}</h3>
                            <div style="font-size:0.85rem; color:var(--ink-soft)">${c.count} emails • First seen ${new Date(c.first_seen).toLocaleString()} • Last seen ${new Date(c.last_seen).toLocaleString()}</div>
                        </div>
                        <span class="verdict-badge danger">${c.count} EMAILS</span>
                    </div>
                    <div style="font-family:monospace; font-size:0.85rem; color:var(--ink-muted); margin-bottom:1rem; background:rgba(0,0,0,0.3); padding:8px; border-radius:4px">
                        Fingerprint: ${c.subject_fingerprint} | Sender domain: ${c.sender_domain}
                    </div>
                    <div class="row" style="gap:10px; flex-wrap:wrap">
                        ${(c.analysis_ids || []).map(id => `<a href="/ui/report/${id}" class="btn-outline btn-sm" style="text-decoration:none">${id.substring(0,8)}...</a>`).join('')}
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<div style="text-align:center; padding:2rem; color:#EF4444">Error loading campaigns: ${e.message}</div>`;
        }
    }
  </script>
</body>
</html>
