# ingress-nginx (two or more controller replicas behind the organisation's load balancer pair). TLS with the
# organisation's certificate in the Secret soc-tls. Put the shared rate limit here: it applies across replicas.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soc-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m          # the platform's own body limit
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "50"               # per client address, across every API replica
spec:
  ingressClassName: nginx
  tls:
    - hosts: [soc.CHANGE-ME.internal]
      secretName: soc-tls
  rules:
    - host: soc.CHANGE-ME.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: soc-api, port: {name: http}}}
