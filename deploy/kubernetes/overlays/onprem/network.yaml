# The namespace denies everything by default, which includes the database's own pods. They need each other
# (replication), the pooler, the CloudNativePG operator (cnpg-system), DNS, the Kubernetes API and HTTPS to the
# backup store. The platform reaches the database only through the pooler.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-pg
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: soc-pg}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {cnpg.io/cluster: soc-pg}}            # instances and the pooler
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      ports: [{port: 5432, protocol: TCP}, {port: 8000, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {cnpg.io/cluster: soc-pg}}
      ports: [{port: 5432, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 443, protocol: TCP}, {port: 6443, protocol: TCP}]   # backup store, Kubernetes API
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-pg-pooler
spec:
  podSelector: {matchLabels: {cnpg.io/poolerName: soc-pg-pooler}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: agentic-soc}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
      ports: [{port: 5432, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-database-egress
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: agentic-soc}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {cnpg.io/poolerName: soc-pg-pooler}}
      ports: [{port: 5432, protocol: TCP}]
