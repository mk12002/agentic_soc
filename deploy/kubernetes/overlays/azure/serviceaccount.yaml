# Workload identity: pods of this service account get a token for the user-assigned managed identity that Key Vault
# trusts (federated credential on the AKS OIDC issuer for system:serviceaccount:agentic-soc:soc-platform).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soc-platform
  annotations:
    azure.workload.identity/client-id: CHANGE-ME          # the managed identity's client id
