# Secrets stay in Azure Key Vault. The Secrets Store CSI driver reads them with the cluster's workload identity and
# syncs them into the Kubernetes Secret "soc-platform-secrets" that the pods read. Rotating a value in Key Vault
# reaches the pods on their next restart (or with the driver's rotation feature switched on).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: soc-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: CHANGE-ME                      # the workload identity's client id
    keyvaultName: CHANGE-ME
    tenantId: CHANGE-ME
    objects: |
      array:
        - |
          objectName: soc-database-url
          objectType: secret
        - |
          objectName: soc-data-key
          objectType: secret
        - |
          objectName: soc-llm-api-key
          objectType: secret
        - |
          objectName: soc-breakglass-sha256
          objectType: secret
  secretObjects:
    - secretName: soc-platform-secrets
      type: Opaque
      data:
        - {objectName: soc-database-url, key: SOC_DATABASE_URL}
        - {objectName: soc-data-key, key: SOC_DATA_KEY}
        - {objectName: soc-llm-api-key, key: SOC_LLM_API_KEY}
        - {objectName: soc-breakglass-sha256, key: SOC_BREAKGLASS_SHA256}
