# Secrets stay in Azure Key Vault. The Secrets Store CSI driver reads them with the workload identity and mounts each
# as a file under /mnt/secrets; the platform reads them through *_FILE settings (settings.yaml). Nothing is synced
# into a Kubernetes Secret, so no secret value is stored in etcd. Rotating a value in Key Vault reaches the pods on
# their next restart (or with the driver's rotation feature switched on).
#   soc-database-url           runtime role (read / write, append-only audit log), ?sslmode=verify-full&sslrootcert=system
#   soc-database-migrator-url  schema owner: read only by the init-db container
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: soc-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: CHANGE-ME                      # the workload identity's client id
    keyvaultName: CHANGE-ME
    tenantId: CHANGE-ME
    objects: |
      array:
        - |
          objectName: soc-database-url
          objectType: secret
        - |
          objectName: soc-database-migrator-url
          objectType: secret
        - |
          objectName: soc-data-key
          objectType: secret
        - |
          objectName: soc-llm-api-key
          objectType: secret
        - |
          objectName: soc-breakglass-sha256
          objectType: secret
