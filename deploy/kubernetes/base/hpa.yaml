# More analysts, more API replicas. Never fewer than two; four fit three 2-vCPU nodes. Keep maxReplicas x workers x pool within the database's
# max_connections (docs/HIGH_AVAILABILITY.md section 4.1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soc-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: soc-api}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
