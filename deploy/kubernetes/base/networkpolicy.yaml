# Default deny, then only what the platform needs. Kubernetes policies filter by address and port, not host name:
# restrict outbound HTTPS to the connector endpoints at the egress firewall (CLIENT_DEPLOYMENT_GUIDE.md egress list).
# The database is reached through a policy each overlay adds ("soc-database-egress": the managed server's subnet on
# Azure, the CloudNativePG pods on-prem) - never "port 5432 anywhere".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-api-ingress
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: soc-api}}
  policyTypes: [Ingress]
  ingress:
    - from:                                     # the ingress controller's pods (on-prem); Azure replaces this with
        - namespaceSelector:                    # the Application Gateway subnet (AGIC sends from outside the cluster)
            matchLabels: {soc-ingress: "true"}     # label the ingress controller's namespace with this
          podSelector:
            matchLabels: {app.kubernetes.io/name: ingress-nginx}
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soc-egress
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: agentic-soc}}
  policyTypes: [Egress]
  egress:
    - to:                                                               # DNS: the cluster's resolver only
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - ports: [{port: 443, protocol: TCP}]                               # tool APIs, Entra, LLM gateway, feeds
