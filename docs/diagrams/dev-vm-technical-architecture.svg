<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .zone{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:6 4}
      .zoneb{fill:#eef4ff;stroke:#7ea2d6;stroke-dasharray:6 4}
      .zoned{fill:#f3f0ff;stroke:#a495d6;stroke-dasharray:6 4}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.3}
      .ctr{fill:#ffffff;stroke:#2563eb;stroke-width:1.4}
      .ext{fill:#fff7e8;stroke:#c2410c;stroke-width:1.2}
      .no{fill:#fef2f2;stroke:#b91c1c;stroke-width:1.2}
      .fw{fill:#1e293b}
      .h{font-weight:600;fill:#0f172a}
      .t{font-weight:600;fill:#1e293b;font-size:13.5px}
      .s{fill:#475569;font-size:12px}
      .z{fill:#334155;font-weight:600;font-size:13px}
      .w{fill:#ffffff;font-weight:600;font-size:12px}
      .line{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#475569;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lbl{fill:#1e293b;font-size:11.5px;font-weight:600}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="30" y="36" class="h" font-size="20">Agentic SOC - development VM technical architecture</text>
  <text x="30" y="58" class="s">Internal build-and-demo environment: 1 engineer, 1 month, synthetic data only. Arrows start at the side that opens the connection; labels give protocol and port.</text>

  <!-- ============ corporate network -->
  <rect x="20" y="80" width="250" height="560" rx="12" class="zone"/>
  <text x="34" y="104" class="z">Company network</text>
  <rect x="36" y="120" width="218" height="86" rx="8" class="box"/>
  <text x="48" y="145" class="t">Engineer workstation</text>
  <text x="48" y="165" class="s">company laptop, company SSO</text>
  <text x="48" y="181" class="s">+ MFA; the only user of the VM</text>
  <text x="48" y="197" class="s">(client sees screen-share demos)</text>
  <rect x="36" y="240" width="218" height="72" rx="8" class="box"/>
  <text x="48" y="265" class="t">VPN / bastion</text>
  <text x="48" y="285" class="s">company remote access with MFA;</text>
  <text x="48" y="301" class="s">the VM has no public address</text>
  <rect x="36" y="346" width="218" height="88" rx="8" class="box"/>
  <text x="48" y="371" class="t">Company IT and InfoSec</text>
  <text x="48" y="391" class="s">EDR console, patching,</text>
  <text x="48" y="407" class="s">vulnerability scanning, backups</text>
  <text x="48" y="423" class="s">per company policy</text>
  <rect x="36" y="468" width="218" height="72" rx="8" class="box"/>
  <text x="48" y="493" class="t">Company SIEM (optional)</text>
  <text x="48" y="513" class="s">structured JSON logs and the</text>
  <text x="48" y="529" class="s">audit export from the platform</text>
  <path d="M145 206 V236" class="line"/>
  <text x="152" y="226" class="lbl">HTTPS</text>

  <!-- ============ development VM -->
  <rect x="300" y="80" width="700" height="560" rx="12" class="zoneb"/>
  <text x="316" y="104" class="z">Development VM - company-managed, internal network, no inbound internet</text>
  <rect x="316" y="114" width="668" height="30" rx="6" class="box"/>
  <text x="328" y="134" class="s">Host OS: company EDR agent · host firewall · disk encryption (BitLocker / ADE) · patching by IT</text>

  <!-- docker engine -->
  <rect x="316" y="156" width="430" height="300" rx="10" class="zoned"/>
  <text x="330" y="178" class="z">Docker engine (non-root containers)</text>
  <rect x="332" y="190" width="196" height="96" rx="8" class="ctr"/>
  <text x="344" y="213" class="t">soc-api</text>
  <text x="344" y="232" class="s">FastAPI + web console</text>
  <text x="344" y="248" class="s">listens on 127.0.0.1:8080</text>
  <text x="344" y="264" class="s">dev sign-in, local only</text>
  <text x="344" y="280" class="s">rate limit, CSP, audit</text>
  <rect x="536" y="190" width="196" height="96" rx="8" class="ctr"/>
  <text x="548" y="213" class="t">soc-scheduler</text>
  <text x="548" y="232" class="s">jobs: vulnerability, incident,</text>
  <text x="548" y="248" class="s">phishing, intelligence,</text>
  <text x="548" y="264" class="s">reports, retention, self-check</text>
  <text x="548" y="280" class="s">(database leases)</text>
  <rect x="332" y="300" width="196" height="76" rx="8" class="ctr"/>
  <text x="344" y="323" class="t">postgres:16</text>
  <text x="344" y="342" class="s">internal Docker network only</text>
  <text x="344" y="358" class="s">port 5432 not published</text>
  <rect x="536" y="300" width="196" height="76" rx="8" class="ctr"/>
  <text x="548" y="323" class="t">Encrypted file store</text>
  <text x="548" y="342" class="s">raw payloads, reports</text>
  <text x="548" y="358" class="s">Fernet (AES-128 + HMAC)</text>
  <rect x="332" y="388" width="400" height="56" rx="8" class="box"/>
  <text x="344" y="410" class="t">21 connectors in fake mode</text>
  <text x="344" y="428" class="s">vendor-shaped synthetic fixtures; no tool credentials, no tool calls</text>
  <path d="M430 286 V296" class="line"/>
  <path d="M634 286 V296" class="line"/>

  <!-- secrets / data / toolchain -->
  <rect x="760" y="156" width="224" height="104" rx="8" class="box"/>
  <text x="772" y="179" class="t">Secrets</text>
  <text x="772" y="198" class="s">Azure OpenAI key in a file</text>
  <text x="772" y="214" class="s">readable by the service user</text>
  <text x="772" y="230" class="s">(SOC_LLM_API_KEY_FILE);</text>
  <text x="772" y="246" class="s">monthly token budget</text>
  <rect x="760" y="272" width="224" height="104" rx="8" class="box"/>
  <text x="772" y="295" class="t">Synthetic data only</text>
  <text x="772" y="314" class="s">fictional demo organisation</text>
  <text x="772" y="330" class="s">workbook estate: example.invalid,</text>
  <text x="772" y="346" class="s">RFC 5737 addresses; no client</text>
  <text x="772" y="362" class="s">or company data</text>
  <rect x="760" y="388" width="224" height="110" rx="8" class="box"/>
  <text x="772" y="411" class="t">Dev toolchain</text>
  <text x="772" y="430" class="s">Python 3.11: tests on SQLite</text>
  <text x="772" y="446" class="s">and PostgreSQL; Node 20 +</text>
  <text x="772" y="462" class="s">headless Chrome UI tour;</text>
  <text x="772" y="478" class="s">Git + pre-commit secret scan</text>

  <!-- AI control path -->
  <rect x="316" y="470" width="430" height="152" rx="10" class="box"/>
  <text x="330" y="494" class="t">LLM gateway client (inside soc-api / scheduler)</text>
  <text x="330" y="515" class="s">1. pseudonymise people and hosts before the prompt leaves</text>
  <text x="330" y="533" class="s">2. send cited evidence only; budget and per-feature limits</text>
  <text x="330" y="551" class="s">3. drop uncited statements and figures not in the evidence</text>
  <text x="330" y="569" class="s">4. restore names for the analyst; record the call</text>
  <text x="330" y="591" class="s">The model writes explanations only - never a score, verdict</text>
  <text x="330" y="607" class="s">or action; with it off every result is identical.</text>
  <text x="1064" y="662" class="s">Outbound opened by soc-api / scheduler (LLM, feeds)</text>
  <text x="1064" y="678" class="s">and by Docker / Git (registries, GitHub)</text>
  <rect x="760" y="510" width="224" height="112" rx="8" class="box"/>
  <text x="772" y="533" class="t">Logs and audit</text>
  <text x="772" y="552" class="s">hash-chained audit trail</text>
  <text x="772" y="568" class="s">(never pruned); access log;</text>
  <text x="772" y="584" class="s">JSON logs on stdout, secrets</text>
  <text x="772" y="600" class="s">masked; /health, /metrics</text>
  <path d="M254 276 H296" class="line"/>
  <text x="262" y="268" class="lbl">RDP / SSH</text>
  <path d="M872 622 V662 H145 V544" class="dash"/>
  <text x="300" y="680" class="lbl">optional log forwarding to the company SIEM (HTTPS / log agent)</text>

  <!-- ============ egress control -->
  <rect x="1018" y="80" width="26" height="560" rx="6" class="fw"/>
  <text x="1036" y="360" class="w" transform="rotate(-90 1036 360)" text-anchor="middle">Company firewall / proxy - outbound allow-list only</text>

  <!-- ============ internet -->
  <rect x="1062" y="80" width="318" height="560" rx="12" class="zone"/>
  <text x="1076" y="104" class="z">Internet (outbound HTTPS 443 only)</text>
  <rect x="1076" y="120" width="290" height="96" rx="8" class="ext"/>
  <text x="1088" y="143" class="t">Azure OpenAI (company subscription)</text>
  <text x="1088" y="162" class="s">TLS; pseudonymised, cited evidence;</text>
  <text x="1088" y="178" class="s">budget-capped; key rotated when the</text>
  <text x="1088" y="194" class="s">VM is decommissioned</text>
  <rect x="1076" y="236" width="290" height="80" rx="8" class="ext"/>
  <text x="1088" y="259" class="t">Public vulnerability intelligence</text>
  <text x="1088" y="278" class="s">services.nvd.nist.gov · api.first.org ·</text>
  <text x="1088" y="294" class="s">www.cisa.gov - CVE identifiers only</text>
  <rect x="1076" y="336" width="290" height="80" rx="8" class="ext"/>
  <text x="1088" y="359" class="t">Package and image registries</text>
  <text x="1088" y="378" class="s">PyPI · npm · Docker Hub (build only;</text>
  <text x="1088" y="394" class="s">versions locked, audited)</text>
  <rect x="1076" y="436" width="290" height="186" rx="8" class="ext"/>
  <text x="1088" y="459" class="t">GitHub repository + Actions CI</text>
  <text x="1088" y="478" class="s">every push runs:</text>
  <text x="1088" y="496" class="s">· lint, bandit static analysis</text>
  <text x="1088" y="514" class="s">· pip-audit of the dependency lock</text>
  <text x="1088" y="532" class="s">· secret + confidential-name scan, gitleaks</text>
  <text x="1088" y="550" class="s">· full tests on SQLite and PostgreSQL 16</text>
  <text x="1088" y="568" class="s">· CycloneDX SBOM per build</text>
  <text x="1088" y="586" class="s">· Trivy image scan (fails on fixable</text>
  <text x="1088" y="602" class="s">  high / critical)</text>

  <!-- outbound arrows (from the VM edge, through the firewall) -->
  <path d="M1000 168 H1072" class="line"/>
  <path d="M1000 276 H1072" class="line"/>
  <path d="M1000 376 H1072" class="line"/>
  <path d="M1000 528 H1072" class="line"/>

  <!-- ============ never connected -->
  <rect x="20" y="700" width="1360" height="176" rx="12" class="no"/>
  <text x="36" y="726" class="z">Never connected to or held on this VM</text>
  <text x="36" y="752" class="s">· the client's security tools and their APIs (EDR, e-mail, identity, scanners, SIEM, ITSM) - every connector runs on synthetic fixtures</text>
  <text x="36" y="774" class="s">· client data or company production data; the client's Entra tenant; any production credential</text>
  <text x="36" y="796" class="s">· inbound connections from the internet (no public address; the console listens on localhost)</text>
  <text x="36" y="826" class="t">After the month</text>
  <text x="36" y="848" class="s">The platform is deployed into the client's own environment under the client's security and architecture review (Entra SSO + MFA, the client's vault, WAF, SIEM).</text>
  <text x="36" y="866" class="s">This VM is decommissioned: the Azure OpenAI key is rotated, the VM and its disks are deleted, access and allow-list rules are removed.</text>
</svg>
